name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: cmm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cmm_quality
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmm -d cmm_quality"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cmm:ci-only-password@localhost:5432/cmm_quality
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      DEMO_USER_PASSWORD: ci-only-demo
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (from lockfile)
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend (oxlint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  stack:
    name: Compose smoke test (make up)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Create .env from template
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose --profile worker --profile prod config --quiet
      - name: Build and start stack
        run: make up
      - name: API health returns 200 with database up
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o health.json -w '%{http_code}' http://localhost:8000/api/health || true)
            if [ "$code" = "200" ]; then cat health.json; exit 0; fi
            sleep 2
          done
          echo "health never returned 200 (last: $code)"; cat health.json || true
          docker compose logs api db; exit 1
      - name: Web placeholder served and proxies /api
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ | grep -q '<title>Smart CMM Quality</title>'; then break; fi
            sleep 2
          done
          curl -sf http://localhost:5173/ | grep -q '<title>Smart CMM Quality</title>'
          curl -sf http://localhost:5173/api/health
      - name: Production web image builds
        run: docker compose --profile prod build web-prod
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: make down
