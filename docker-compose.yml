# Smart CMM Quality: local / on-prem stack.
# Dev:  make up   -> db, mailpit, api (8000), worker, web (Vite dev, 5173)
# The worker runs the folder watcher, escalation sweeper and outbox dispatcher.
# Production web build (Nginx, 8080) runs under the "prod" profile.

name: smart-cmm-quality

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cmm_quality}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cmm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cmm_quality}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      DATA_DIR: /app/data
    # Short graceful timeout: open SSE streams must not block reloads or restarts.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--timeout-graceful-shutdown", "3"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cmm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cmm_quality}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      DATA_DIR: /app/data
    command: ["python", "-m", "app.worker.main"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

  web-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    ports:
      - "${WEB_PROD_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
